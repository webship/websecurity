name: Web Security - Default
description: A recipe to manage default installed modules, configs and permissions.
type: install
install:
  - recaptcha_v3
  - flood_control
  - honeypot
  - antibot
  - captcha
  - friendlycaptcha
  - seckit
  - security_review
  - klaro
  - token
  - bpmn_io
  - eca_base
  - eca_form
  - eca_misc
  - eca_user
  - login_emailusername
  # Web Security saves random Friendly Captcha keys once the recipe is applied.
  - websecurity
config:
  # Respect site owners' own tweaks when the active config differs.
  strict: false
  import:
    recaptcha_v3: '*'
    flood_control: '*'
    antibot: '*'
    captcha:
      - captcha.captcha_point.user_register_form
  actions:
    # The settings hold translatable text in English, so they need a language
    # code. A fixed value: recipe inputs are not collected when the recipe is
    # applied from an installer batch.
    recaptcha_v3.settings:
      simpleConfigUpdate:
        langcode: en
    captcha.settings:
      simpleConfigUpdate:
        default_challenge: friendlycaptcha/friendlycaptcha
    # Show the default challenge on the user registration form.
    captcha.captcha_point.user_register_form:
      setStatus: true
    friendlycaptcha.settings:
      simpleConfigUpdate:
        # The site key and API key are random values saved by the Web Security
        # module: the local API endpoint signs its puzzles with the site key,
        # so each site needs its own.
        api_endpoint: local
        enable_validation_logging: false
    system.site:
      simpleConfigUpdate:
        page.403: '/user/login'
    user.role.authenticated:
      grantPermissions:
        - 'bypass honeypot protection'
        - 'skip antibot'
        - 'skip CAPTCHA'
    honeypot.settings:
      simpleConfigUpdate:
        unprotected_forms:
          - search_form
          - search_block_form
          - views_exposed_form
          - honeypot_settings_form
        protect_all_forms: false
        log: true
        element_name: url
        time_limit: 2
        expire: 300
        form_settings:
          user_register_form: true
          user_login_form: true
          user_pass: true
          node_webpage_form: false
          node_webblog_form: false
          node_webform_form: true
          comment_comment_form: true
          webforms: true
          webform_submission_contact_add_form: true
          webform_submission_newsletter_subscribe_add_form: true
    seckit.settings:
      simpleConfigUpdate:
        seckit_xss:
          csp:
            checkbox: false
            report-only: false
            default-src: ""
            script-src: ""
            object-src: ""
            img-src: ""
            media-src: ""
            frame-src: ""
            child-src: ""
            font-src: ""
            connect-src: ""
            report-uri: report-csp-violation
            policy-uri: ""
            style-src: ""
          x_xss:
            select: 2
        seckit_csrf:
          origin: false
          origin_whitelist: ""
        seckit_clickjacking:
          js_css_noscript: false
          noscript_message: "Sorry, you need to enable JavaScript to visit this website."
          x_frame: "1"
          x_frame_allow_from: ""
        seckit_ssl:
          hsts: false
          hsts_subdomains: false
          hsts_max_age: 1000
          hsts_preload: false
        seckit_various:
          from_origin: false
          from_origin_destination: same
          disable_autocomplete: true
    user.flood:
      simpleConfigUpdate:
        uid_only: false
        ip_limit: 10
        ip_window: 1800
        user_limit: 8
        user_window: 1800
    security_review.settings:
      simpleConfigUpdate:
        untrusted_roles:
          - anonymous
        log: true
